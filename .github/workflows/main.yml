name: Sync with original Crosswire subversion repository

on:
  pull_request:
    branches: [ "master" ]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install subversion
      run: sudo apt-get install -y subversion
    - name: Checkout original repository
      run: svn co https://crosswire.org/svn/sword/trunk/ .
    
    - name: Get revision of svn repository
      id: get_revision
      run: echo "revision=$(svn info | grep Revision | cut -d ' ' -f2-)" >> $GITHUB_OUTPUT

    - name: Get count of changed files
      id: get_changed
      run: echo "changed=$(git status --short | wc -l)" >> $GITHUB_OUTPUT
      
    - name: Add & Commit
      if: steps.get_changed.outputs.changed != '0'
      uses: EndBug/add-and-commit@v9
      with:
        new_branch: 'sword-revision-{{ steps.get_revision.revision }}'
        message: '[Sync {{ steps.get_revision.revision }}] Commit new revision from original svn repository'
        push: true
        tag: 'rev-{{ steps.get_revision.revision }}'
        
        
    
        
